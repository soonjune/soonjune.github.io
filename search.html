    "matrix-decompositions": {
        "title": "Matrix Decompositions",
            "author": "soonjune",
            "category": "",
            "content": "데이터사이언스대학원 Bootcamp 4일차 수업은 4장 Matrix Decomposition을 공부했다. 선형대수의 핵심적 개념인 eigenvalue와 eigenvector가 나오므로 잘 알아두는 게 중요하다.4.1 Determinant and TraceDeterminant는 square matrix에 대해서만 정의되며 Laplace Expansion을 통해 구할 수 있다. 역행렬의 존재여부를 확인하고 구하거나 n-dimensional 평행육면체의 부피를 구하는 등에 쓰인다.Trace는 diagonal elements의 합이다. 두 행렬이 각각 n X k, k X n이라면 교환법칙이 성립하기 때문에 cyclic permutation에 대해 invariant하다.4.2 Eigenvalues and Eigenvectors행렬 A의 eigenvalue와 eigenvector를 구하는 방법을 알아보자. 우선 charateristic polynomial을 solve해서 λ를 구한다. 이때 구해지는 λ가 eigenvalue들이 된다. 특정 λ에 대해 (A-λI)x = O를 풀어서 구한 벡터 x들이 eigenvectors가 되며 이들의 span이 eigenspace가 된다.4.4 Eigendecomposition and DiagonalizationDiagonal matrix D는 과 같이 invertible matrix P를 이용해서 나타낼수 있는 행렬을 의미한다. 이때, A와 D는 닮음 관계에 있다고 한다. 식을 다시 표현하면 AP = PD로 나타낼 수 있는데 이는 eignevalue와 eigenvector를 정의할 때 보았던 식과 유사하다. 즉, 우리는 A를  꼴로 나타낼 수 있는데 이를 eigendecomposition이라고 한다. D는 entry(대각선 값)들이 eigenvalue이고 P는 그에 상응하는 eigenvector들이 column vector인 행렬이다. P는 full rank인 square matrix여야 한다. 이는 eigenvector들이 모두 선형독립이라는 말과 동치이다.Orthormal Basis B의 역행렬은 transopose와 같다는 점이 eigendecomposition할 때 유용하게 쓰일 수 있다. 우선 하나의 eigenvector를 이용해서 Gram–Schmidt process를 수행하면 서로 orthornormal한 벡터들을 얻을 수 있다.4.5 Singular Value Decompositionsquare matrix가 아닌 행렬도 분해해서 차원을 축소해서 나타낼수 있다. Eigendecompostion의 일반화된 버전으로 볼 수 있기에 SVD는 특정 행렬에 대해 항상 가능하다.",

    }

    "number-system-and-boolean-algebra": {
        "title": "Number Systems and Boolean Algebra",
            "author": "soonjune",
            "category": "",
            "content": "데이터사이언스대학원 Bootcamp 6일차 데이터사이언스를 위한 컴퓨터 시스템 강의 공부한 내용을 정리해본다.1. Number Systems컴퓨터는 알다시피 데이터를 0과 1의 조합으로 표현한다. 이진수를 사용하는 이유는 높은 전압과 낮은 전압으로 표현이 가능하기 때문이다. 0, 1 이외의 다른 값이 존재한다면 모호성이 높아질 수밖에 없다. 컴퓨터에서는 2의 보수를 사용해서 연산을 하는데 그 이유는 효율성과 관련이 있다.보수(raidx complement)r-진법으로 표현된 n개의 자리를 가진 수 x의 보수는 x가 0일 경우 0, 0이 아닐 경우 로 정의한다.x의 (r-1)의 보수(diminished radix complement)는 로 정의한다. 따라서 1의 보수를 2의 보수로 만들기 위해서는 1을 더해주면 된다.1의 보수는 이진법으로 표현한 원래 숫자의 단순 bit flip으로 구할 수 있다. 이 때 0이 되는 경우가 2가지 나오기 때문에(모든 숫자가 0 또는 모든 숫자가 1) 2의 보수를 사용해서 하드웨어로 구현한다.2. Boolean Algebra and Logic Gates  First-order logic  함수적 완전성(Functional Completeness): 어떤 Boole 연산의 집합이 함수적으로 완전하다라는 뜻은 주어진 입력 변수의 집합에 대하여 그 집합에 속한 연산들로 모든 서로 다른 Boole 함수를 정의할 수 있을을 뜻한다. 함수적 완전성을 만족하는 연산의 기본적인 집합은 {AND, OR, NOT}이다. {NOR}와 {NAND}도 각각 AND, OR, NOT을 implement할 수 있기 때문에 함수적으로 완전하다.  논리 설계시 NAND나 NOR 게이트 사용을 선호하는데 AND, OR, NOT을 각각 구현하는 것보다 transistor가 더 적게 들어가기 때문이다.  논리 게이트(Logic Gate)는 Boole 연산을 그림으로 나타낼 수 있게 한다.",
        "url": "/number-system-and-boolean-algebra"
    }
    ,
    
    "analytic-geometry": {
        "title": "Analytic Geometry",
            "author": "soonjune",
            "category": "",
            "content": "데이터사이언스대학원 Bootcamp 3일차에는 교재의 해석기하학 챕터(Chapter 3)를 다뤘다. 이번 장에서는 앞서 배운 내용들에 대한 기하학적 해석들을 살펴본다. Geometric vector를 이용해서 길이, 거리, 두 벡터간 각도를 계산할 수 있는데, 이를 위해서 아래 내용들부터 살펴보자.3.1 NormsNorm은 벡터 공간을 input으로 하고 output으로 음이 아닌 실수를 내뱉는 함수이다.링크에 나온의 세가지 조건을 만족해야 한다. 대표적으로 l1-norm과 l2-norm이 있는데 l2-norm은 Euclidean distance라고 부르기도 한다.3.2 Inner Products벡터의 길이 또는 두 벡터 사이의 각도에 대한 직관적인 이해를 위해서 inner product 개념이 활용된다. Inner product로 두 벡터가 서로 orthogonal한지 확인할 수 있다. 우선 inner product의 대표격인 dot product부터 살펴보자.3.2.1 Dot ProductDot product 또는 스칼라곱은 유클리드 공간의 두 벡터로부터 실수 스칼라를 얻는 연산이다.3.2.2 General Inner Products먼저, linear mapping 개념에 더해서 bilinear mapping 개념을 살펴본다. Bilinear map은 두개의 벡터 공간을 input으로 받아 새로운 벡터 공간을 뱉어내는 함수이다.Symmetric교환에 대하여 불변Positive definite0 벡터를 제외한 벡터 공간을 input으로 해서 같은 벡터로 bilinear mapping을 해서 항상 0보다 크면 bilinear map은 positive definite이다. 두개 argument 모두 영벡터인 경우에만 0이 나온다.최종적으로 일반적인 inner product는 positive definite, symmetric한 bilinear mapping으로 같이 정의할 수 있다.3.2.3 Symmetric, Positive (Definite Matrices)[https://en.wikipedia.org/wiki/Definite_symmetric_matrix]n X n 실수 행렬 A가 symmetric, postive definite이고 &lt;x, y&gt; = 이면 벡터 공간 V와 V의 ordered basis B에 대하여 &lt;·,·&gt;: V x V → R은 inner product이다. x̂(x hat)과 ŷ(y hat)은 basis B에 대한 x, y 좌표이다.3.3 Lengths and Distances길이는 inner product에 루트를 씌어준 것, 즉 norm으로 정의할 수 있다. 하지만 모든 norm이 inner product로 유도되는 것은 아니라는 점에 유의하자. Inner product에 따라서 길이가 달라질 수 있다. 두 벡터 간 거리는 두 벡터를 뺀 것의 norm으로 정의할 수 있다.3.4 Angles and Orthogonality두 subspace 간 각도는 inner product를 이용해서 정의할 수 있다. 각도는 방향이 얼마나 유사한지를 나타낸다. 비슷할 수록 각도는 0에 가깝다.두 벡터를 argument로 하는 inner product가 0 일 때 orthogonal하다고 한다. 특별히 두 벡터의 norm이 1인 경우는 orthonormal하다고 한다.Orthogonal Matrix는 transpose와 곱해서 identity matrix가 나오는 square matrix로 정의한다. 이는 을 의미한다.3.5 Orthonormal Basisn-dimensional vector space에서 n개의 basis 벡터들이 서로 orthogonal하고 길이가 1인 경우이다.3.6 Orthogonal ComplementD-dimensional vector space V는 M-dimensional subspace U와 그 (D-M)-dimensional orthogonal complement로 나타낼 수 있다. U와 그 orthogonal complement의 교집합의 원소는 영벡터 뿐이다.3.8 Orthogonal Projections앞서 vector space V를 어떤 subspace U와 그 orthogonal complement로 표현할 수 있다는 것을 알았다. 이를 이용해서 V에 속하는 벡터 x를 U에 projection할 수 있다. U의 ordered basis B와 B의 각 원소의 coordinate을 표현하는 λ를 행렬곱하면 x를 projection한 결과를 얻을 수 있다. 우리가 관심 있는 부분은 λ이다. (x - Bλ) = 0(B^TB)^{-1}B^TxB^TB$$의 역행렬이 존재한다. 따라서 λ를 구할 수 있다.",
        "url": "/analytic-geometry"
    }
    ,
    
    "vector-spaces-and-linear-independence": {
        "title": "Vector Spaces and Linear Independence",
            "author": "soonjune",
            "category": "",
            "content": "데이터사이언스대학원 Bootcamp 2일차에는 벡터 공간(Vector space)와 선형 독립(Linear Independence)을 주로 다뤘다. 들어가기에 앞서, 저번 시간에 배웠던 연립 일차 방정식을 풀기 위한 elementary transformation에 대해 잠깐 살펴보자. Elementray row/column operations은 elementary matrix를 우측 또는 좌측에 곱함으로써 수행할 수 있다.(Elementary Matrix) 기본행연산에는 3가지가 있는데 아래와 같다.  두 row를 바꾼다 (swap)  row에 0이 아닌 상수를 곱한다.  두 row를 더한다.위 세가지 operation은 solution에 영향을 끼치지 않는다. 따라서 이들 연산을 이용해서 행렬을 reduced echelon form(계단 모양으로 나타난다)으로 바꿔 해를 구한다.2.3.3 The Minus-1 Trick행렬 A가 k X n이라면 reduced echeolon form으로 만든 뒤 n X n으로 만들어 주기 위해서 n - k row를 추가한다. 이 때 pivot이 없는 대각선 부분을 -1로 만들어주기 위해 row를 해당 부분에 추가한다. 이 때 -1이 있는 부분의 column을 이용해서 Homogeneous system1의 바로 해를 찾을 수 있다.2.3.4 Algorithms for Solving a System of Linear EquationsGaussian elimination은 아래 상황에서 모두 사용되기에 매우 유용하다.(1) determinant를 계산(2) 선형 독립 여부 확인(3) 역행렬 연산(4) rank 계산(3) 벡터 공간의 basis 구하기하지만 효율성을 위해서 실용적으로는 어느 정도의 오차를 감안하고 iterative한 방법이 활용되고 있다.2.4 Vector Spaces2.4.1 GroupsGroup 정의.n X n 행렬에 대해서도 행렬의 곱셈 정의에 따라 결합법칙이 성립하고 살수 n X n 행렬에 대해 닫혀 있다. 항등원 I가 존재하고 역행렬이 존재할 경우 위에서 정의한 group애 해당한다. 이를 general linear group이라고 부른다.2.4.2 Vector SpacesV는 집합니다. 이 집합의 원소를 벡터라고 한다. Real-valued vector space V = (V, +, ·)은 아래 두 연산을 갖는 집합이다.            : 벡터 덧셈        · : 스칼라 곱셈벡터간 곱셈은 정의되지 않았음에 유의하자.2.4.3 Vector SubspacesVector space에 contained된 space. Vector space가 지닌 특성들을 모두 inherit한다. Vector subspace는 closure 조건을 만족시켜야 하며 덧셈에 대한 항등원인 0을 포함해야 한다.  Vector subspace 간 교집합도 vector subspace이다. (증명)  Ax = O의 solution x가 항상 의 subspace이다.2.5 Linear Independence키워드: 선형 결합, 선형독립선형결합은 Vector space에 있는 유한한 수의 벡터들과 상수배를 이용해서 vector space 내 다른 벡터 v를 나타내는 방법. 선형독립은 선형결합으로 영벡터를 나타내는 방법이 오직 상수(람다)를 모두 0으로 해야만 하는 경우이다.Echelon form으로 나타냈을 때 모든 column이 pivot column일 경우에만 선형독립이다(필요충분)2.6 Basis and Rank2.6.1 Generating Set and BasisGenerating set은 Vector Space V에 속하는 벡터 v가 유한(k)개의 벡터로 나타낼 수 있으면 이 벡터들의 집합 A를 generating set이라고 한다. Generating set A를 가지고 만들 수 있는 모든 선형결합의 집합을 span of A라고 정의한다.Basis는 Vector space V의 가장 작은 generating set이다. 가장 작다는 것은 해당 generating set보다 더 작은 generating set의 조건을 만족하는 집합이 없음을 의미한다. Generating set의 선형독립인 vector들을 V의 basis라고 부른다.Basis는 unique하지 않지만 벡터 수는 같다. 이때 vector space의 차원은 basis 벡터의 수와 같다. basis를 이용해서 vector space 내 다른 vector를 표현할 때의 해는 유일하다.2.6.2 Rank행렬 내에 independent한 행 또는 열의 수를 rank라고 한다.2.7 Linear Mappings벡터 공간의 성질을 만족시키기 위해서 mapping할 때 특정 성질을 만족하는 경우 linear mapping이라고 한다. Linear mapping을 행렬로 표현할 수 있다.Image와 Kernel(또는 Null Space)은 다음과 같이 정의한다. Kernel은 영행렬이 나오게끔하는 정의역 내 벡터들의 집합. Image는 치역으로 볼 수 있다.(Rank-Nullity Theorem)1: A system of linear equations is homogeneous if all of the constant terms are zero",

            "content": "첫번째 챕터 Pythonic Thinking의 7-9번 팁을 간단하게 요약해보자.  Range 대신 Enumerate를 쓰자.          간결하게 iterator와 index를 이용할 수 있다.      range를 이용해서 loop를 돌면서 indexing을 하기보다 enumerate를 사용하자.      enumerate의 두번째 파라미터를 이용해서 0 이외의 숫자부터 indexing할 수 있다. 아래 예시        for i, flavor in enumerate(flavor_list, 1): printf(f'{i}: {flavor}')                      Iterator들을 병렬적으로 처리하기 위해 zip을 사용하자.          enumerate와 마찬가지로 zip이라는 기본 함수를 사용해서 여러 iterator들을 병렬적으로 처리할 수 있다.      zip은 iterator의 다음 값에 해당하는 값들을 tuple의 형태로 그때 그때 하나씩 생성한다(lazy generator). 따라서 메모리 걱정 없이 무한정 긴 iterator를 처리할 수 있다.      비교하는 두 iterator의 길이가 다르면 작은 쪽까지만 tuple을 생성하고 멈춘다.      itertools 모듈의 zip_longest를 사용하면 길이가 긴 iterator에 맞춰서 tuple을 생성할 수 있다(짧은 쪽의 값엔 None이 default로 들어간다).        for, while문 다음에는 else 사용을 지양하자.          for나 while문 뒤에 else가 오게되면 어떻게 되는지 알자.      break를 사용하게 되면 뒤에 else가 실행되지 않는다.      따라서 헷갈리고 비직관적인 반복문 뒤 else 사용을 지양하자.      출처: Slatkin, B. (2020). Effective Python: 90 specific ways to write better Python. USA: Addison-Wesley.",
        "url": "/Effective-Python1_3"
    }

    "effective-python1-2": {
        "title": "Pythonic Thinking(2) 파이썬 효율적으로 사용하기",
            "author": "soonjune",
            "category": "",
            "content": "첫번째 챕터 Pythonic Thinking의 4-6번 팁을 간단하게 요약해보자.  F-String을 C-Style Format, str.format보다 우선해서 사용하자. Formatting은 미리 정의된 텍스트와 데이터 값을 사람이 이해할 수 있게 합쳐서 하나의 문자열로 표현하는 과정을 말한다.     a = 0b10111011 b = 0xc5f print('Binary is %d, hex is %d' % (a, b))        위 코드에서 % 옆의 부분을 format string이라고 부르며, %d 부분을 오른쪽의 값들이 대체한다. %는 C의 printf 함수로부터 유래한다. 따라서 이러한 format을 C-style format이라 부른다. C 언어를 사용하던 프로그래머라면 이러한 C-style format string을 사용하는데 익숙하겠지만 네가지 문제가 존재한다.          데이터의 타입이 바뀌면 에러를 발생시킨다.      읽기 어려워 수정이 쉽지 않다.      똑같은 format string을 여러번 사용하고 싶을 때, 오른쪽의 tuple을 반복해야 한다.      3번 문제 해결을 위해 dictionary를 이용할 수 있지만 오른쪽의 key를 최소 두번 지정해줘야 한다.(오른쪽의 format specifier에서 한번, dictionary에서 한번)        Python3에서부터 str.format을 이용하여 % 대신 {}을 placeholder로 사용할 수 있게 됐다.    하지만 이 또한 위의 2번, 4번 문제를 해결하지 못한다는 문제가 있다.    따라서 간결하면서도 강력한 f-string을 사용하자. f-string을 이용하면 아래와 같이 format specifier 안에 직접 파이썬 표현을 추가할 수 있어 유용하다.     for i, (item, count) in enumerate(pantry):     print(f'#{i+1}: '     f'{item.title():&lt;10s} = '     f'{round(count)}')        복잡한 표현 대신 헬퍼 함수를 사용하자.          한 줄로 된 복잡한 코드보다는 반복 사용되는 로직인 경우 헬퍼 함수를 사용하는 것이 명확하다.      if/else를 하용하는 것이 Boolean or 또는 and를 사용하는 것보다 가독성을 높인다.        Multiple Assignment Unpacking을 Indexing 대신 사용하자.     item = ('Peanut butter', 'Jelly') # Indexing 예시 first = item[0] second = item[1] print(first, 'and', second) # Mulitple Assignment Unpacking 예시 first, second = item print(first, 'and', second)        Unpacking을 통해 a, b = b, a와 같이 swap하는 것도 유용하다.          list, str, tuple 같은 모든 iterable에 unpacking을 사용할 수 있다. (iterable 안에 iterable에 대해서도 사용 가능)      Indexing 대신 unpacking을 사용해서 코드의 명확성을 높이자.      출처: Slatkin, B. (2020). Effective Python: 90 specific ways to write better Python. USA: Addison-Wesley.",
        "url": "/Effective-Python1_2"
    }

    "effective-python1-1": {
        "title": "Pythonic Thinking(1) 파이썬 효율적으로 사용하기",
            "author": "soonjune",
            "category": "",
            "content": "유명한 Effective 시리즈의 Python 부분을 읽고 정리하고자 한다. 효율적인 코드 작성을 위한 90가지 방법 중 하루에 3가지씩 정리해보자.첫번째 챕터는 Pythonic Thinking이다. Pythonic이라는 것이 형용사로 만들어질만큼 C나 Java와는 다른 특성을 지는 것을 알 수 있다. Pythonic의 정의를 찾아보니 Stack Overflow에서는 Exploiting the features of the Python language to produce code that is clear, concise and maintainable.이라는 설명이 나온다. 즉, 파이썬 코드의 간결하고 명확한 특성을 나타내는 말이다. Pythonic Thinking은 이러한 명확한 코드를 구현하기 위한 생각 방식이라고 볼 수 있다.  파이썬 버전을 알자 최신 버전은 Python 3.8이다(2020년 8월 기준). 커맨드 또는 터미널에서 python3 --version 또는 python --version을 통해서 버전을 확인할 수 있다. 맥의 경우 python 2.7이 기본으로 설치되어 있는데 새로 Python 3을 설치해주자.          명령 프롬트에서 올바른 버전의 파이썬이 설치되어 있는지 확인하자.        PEP8 스타일 가이드를 따르자          PEP8 가이드에 대해 정리가 잘 된 블로그를 참조하자.      공통의 스타일을 사용함으로써 협업을 용이하게 할 수 있다.      일관적인 스타일의 사용은 추후 자신의 코드 수정을 용이하게 한다.        bytes와 str의 차이를 알자.          bytes: 8-bit values     str: Unicode cdoe points      헬퍼 함수(개발자의 편의를 위한 함수)를 이용해서 원하는 문자 시퀀스 타입을 리턴하도록 하자.      bytes와 str 인스턴스는 서로 연산할 수 없다 (&gt;, ==, +, % 등).      바이너리 데이터를 읽고 쓰기 위해서는 ‘rb’, ‘wb’ 모드에서 파일을 open한다.         with open('data.bin', 'wb') as f:  f.write(b'\\xf1\\xf2\\xf3\\xf4\\xf5')                 with open('data.bin', 'rb') as f:  data = f.read()                    Unicode 데이터를 읽고 쓸 때에는 시스템의 디폴트 인코딩에 주의해라. encoding parameter를 명시적으로 전달하자.  아래는 윈도우의 ‘cp1252’로 인코딩된 파일을 읽는 예시.         with open('data.bin', 'r', encoding='cp1252) as f:  data = f.read()                    출처: Slatkin, B. (2020). Effective Python: 90 specific ways to write better Python. USA: Addison-Wesley.",
        "url": "/Effective-Python1_1"
    }

    "ai-review": {
        "title": "면접 대비 - 인공지능, 기계학습 개념 복습",
            "author": "soonjune",
            "category": "",
            "content": "면접 대비를 위해서 정리한 내용을 간단히 써보고자 한다.1. Machine Learning 정의Well-posed learning problem by Tom Mitchell경험(E)이 늘어남에 따라 특정 작업(T)를 수행하는 지표(P)의 개선이 이루어 질 때 기계가 학습한다고 정의할 수 있다.2. 지도/비지도 학습, 강화학습  지도 학습 - 정답과 오답이 주어져서 training set을 바탕으로 정확도 높은 함수를 학습하는 것이 목표이다. 연속적인 데이터를 바탕으로 예측하는 회귀 문제나 비연속적인 데이터를 분류하는 Classification 문제가 지도 학습의 예이다.  비지도 학습 - 어떤 명시적인 정답이 주어지지 않고 데이터의 특성을 파악하는 과정이라고 할 수 있다. Clustering, Anomaly detection, association, autoencoder와 같은 문제가 해당된다.  강화학습 - Agent가 가장 reward가 높은 policy를 학습하는 학습 방법이다. 이제부터 강화학습에 대해 좀 더 알아보자.Search Problem4가지 요소를 갖는다. - state space, successor function(action, cost), start sate/goal state   여기서 start state에서 goal state까지 도달하게 만드는 일련의 action을 solution이라고 한다.1. Uninformed Search어떤 그래프(State Space Graph) 또는 트리(Search Tree)를 탐색하는 문제에서 아무런 정보가 주어지지 않은 상태이다. DFS, BFS를 통해 완전탐색을 할 수 있다. 그래프는 각각의 상태가 한나의 노드로만 표현되기에 사이즈가 작다는 장점이 있고 트리는 상태가 여러번 등장하기도 하지만 goal state까지 하나의 고유한 path로 나타낼 수 있다는 장점이 있다.  Uniform Cost Search - 모든 옵션까지의 비용을 계산해서 가장 비용이 작은 노드를 확장한다.(Optimal, Complete, but Slow)    2. Informed Search    Gready Search - Heuristic function(goal에 가까운 정도를 예측하는 함수)에 따라 goal state에 가장 가깝다고 생각되는 node를 expand한다. Optimal한 solution을 보장하지 못한다.  A* Search(Best of both worlds - optimal &amp; fast)  조건: Admissible(Optimistic) Heuristic - goal까지의 true cost보다 높게(비관적인) 전망을 하지 않아야 한다.   똑같은 node를 두번 탐색하지 않도록 Graph Search에서는 Consistency 조건이 필요하다. 하나의 arc(간선)의 비용 예측이 실제 비용보다 작아야한다.f = h + ggoal에 더 가까운 지점 B보다 goal에서 먼 A가 더 먼저 fringe에 들어간다는 것을 보이는 것으로 optmiality를 증명할 수 있다.    3. Adverserial Search    Minimax는 deterministic &amp; perfect information 게임에서 상대방이 optimal한 선택을 한다고 가정하고 상대가 나에게 가장 불리한 선택할 것을 가정한뒤 선택에 임한다. 내가 Max agent인 경우에는 상대가 선택한 최소 reward 중에서 가장 큰 것을 선택하게 되고 min agent는 그 반대로 행동할 것이다.Pruning - 선택되지 않을 것들을 탐색에서 제외할 수 있다. 알파-베타 프루닝을 통해서 Max agent는 탐색과정에서 얻을 수 있는 최대 value(알파), Min agent는 탐색과정에서 얻을 수 있는 최소 value(베타)와 새로운 노드를 비교해서 탐색하게 되는 노드 수를 줄이는 과정을 거친다.   Minimizer: v &gt; alpha =&gt; pruneMaximizer: v &lt; beta =&gt; pruneExpectimax는 상대방이 최적의 선택을 하지 않는다고 가정하고 확률을 도입해서 expected value가 가장 큰 노드를 선택한다.4. Markov Decision Processes다음 state는 오직 현재 state에 의해서만 영향을 받는다(Simplified version of the world). 즉, 미래와 과거가 독립이라는 것을 가정한다. 보상 R(s, a, s’) / Transition function T(s, a, s’) = P(s’|s, a)      Value IterationComplexity - O(S^2A)    Bellman Equations: a Bellman equation is a recursion for expected rewards.    Value Iteration의 문제점    V function에는 optimal action이 포함되지 않음. 수렴하는데 오래 걸림. =&gt; Policy Iteration: action을 track하지 않아도 돼서 시간이 적게 걸림(Value iteration 둘다 one-step lookahead 개념 활용) Q value를 활용하면 action을 선택하기 쉬워짐    regret = u(possible action) - u(action taken)it converges to 0 if the strategy is good enoughMDP 아닌 경우(Model-free) 문제점In reinforcement learning (RL), a model-free algorithm (as opposed to a model-based one) is an algorithm which does not use the transition probability distribution (and the reward function) associated with the Markov decision process (MDP)   R, T를 모름해결책: Q-LearningQ-values를 활용: action을 선택하고 그에 따른 reward에 맞춰서 Q-value를 업데이트 해줌.Q-Learning의 문제점비슷한 노드끼리 서로 다르게 보기 때문에 탐색과정을 일일이 거쳐야 한다는 단점. 따라서 feature를 이용해서 state를 일반화해주는 것이 가능하다. =&gt; Feature-Based Representation &amp; Approximate Q-Learning5. Naive Bayes 및 확률 기초 개념 정리1) random variable - 확률적인 과정에 따라 값이 결정되는 변수(오메가 -&gt; E로의 mapping)  2) 조건부 확률 - 주어진 사건이 일어났다는 가정 하에 다른 한 사건이 일어날 확률을 뜻한다.  3) Chain rule  4) Bayes Theorem   5) MLE    6) MAP    7) 조건부 독립 - p(a|b,c)=p(a|c), 즉 b, c가 있거나 없거나 a의 확률에 영향을 미치지 않는다.8) Naive Bayes- 조건부 독립을 가정하면 c의 prior와 c와 다른 사건의 조건부 확률의 곱 또는 log합으로 나타낼 수 있다.   장점은 단순하고 빠르다는 것이 있으나 independent하지 않을 경우 bias 문제에 빠질 수 있으며 pattern을 모델링 할 수 없다는 문제가 있다. 따라서 정확도도 낮은 편이다.6. 기계학습 정리      Overfitting 방지를 위한 regularization term 추가        Backpropagation    A support vector machine (SVM) is a supervised machine learning model that uses classification algorithms for two-group classification problems. After giving an SVM model sets of labeled training data for each category, they’re able to categorize new text.      Kernel Trick - Kernel function(similarity function)은 높은 차원의 내적을 의미한다. K(x_i,x_j)로 구성된 행렬은 positive semi-definite matrix여야 하며 대칭행렬(symetric matrix)이어야 합니다.    PCA - eigenvalue decomposition of covariance matrices7. 딥러닝      CNN - In deep learning, a convolutional neural network (CNN, or ConvNet) is a class of deep neural networks, most commonly applied to analyzing visual imagery.        RNN - A recurrent neural network (RNN) is a class of artificial neural networks where connections between nodes form a directed graph along a temporal sequence.  ",
        "url": "/AI-Review"
    }

    "io": {

            "content": "오늘은 간단히 입출력 방법에 대해 정리해보고자 한다.알고리즘 문제를 풀다보면 입출력으로 인해 시간 초과가 발생하는 경우가 있다.   백준 사이트에서 입출력 속도를 비교한 것을 보고 어떤 입출력을 사용하는 것이 속도 측면에서 나은지 살펴보자.  입력 속도 비교 / 출력 속도 비교입력입력은 자바 기준으로 Scanner보다 BufferedReader와 Integer.parseInt를 사용하는게 약 7배 빠른 것을 알 수 있다.  문제 풀이를 위한 한 줄 라인 입력은 아래와 같이 받을 수 있다.BufferedReader br = new BufferedReader(new inputStreamReader(System.in));// 한 줄에 integer input 하나인 경우int input = Integer.parseInt(br.readLine());// 한 줄에 여러 input이 공백을 구분자로 두고 있는 경우StringTokenizer st = new StringTokenizer(br.readLine());int number1 = Integer.parseInt(st.nextToken());출력출력은 BufferedWriter를 쓰는것이 System.out.println(sb)을 쓰는 것보다 빠르나 차이가 미미하기 때문에 조금 더 편리한 System.out.println(sb)를 사용하는게 좋겠다.C++의 경우C++은 출력에서 cout « i « endl을 사용할 경우 시간 초과가 날 수 있다. endl대신 \"\\n\"을 이용하자.    C++에서 빠른 입출력을 원할 경우 C 표준 입출력을 동기화하는 ios_bas::sync_with_stdio(false); 설정을 해주고 cin.tie(null);을 통해 cin과 cout을 분리해준다. 물론 그냥 C의 표준입출력 scanf/printf를 사용해도 된다.",

    "matrix-algebra-1": {
        "title": "2. Matrix Algebra",
            "author": "soonjune",

            "content": "선형대수 공부 3일차 - 행렬에 대해 알아보자2.1 Matrix OperationsTheorem 1덧셈, 뺄셈, scalar multiple은 교환, 결합, 분배 법칙이 성립한다.행렬의 곱셈은 조금 다른데, linear transformation, function으로 이해할 수 있다.  따라서 곱할 수록 span을 작아진다. 즉, span(A)가 span(AB)를 포함한다.Theorem 2곱셈은 결합법칙, 오른쪽/왼쪽 분배 법칙이 성립하나 교환법칙은 성립하지 않는다. 즉, AB와 BA는 같지 않을 수 있다.  Powers of a Matrix  A가  행렬이라면 과 같이 행렬의 거듭제곱을 정의할 수 있다. 로 정의한다.  Transpose  행렬의 열과 행을 뒤바꾼 것이라 보면 된다.a.     b.    c. For any scalar    d. 2.2 The Inverse of a MatrixTheorem 42X2 행렬의 역행렬 공식Theorem 5Ax = b이고 A가 역행렬이 존재하면 하나의 유일해 를 지닌다.참고) at least 1 solution  no free variableTheorem 6a.    b.    c. Theorem 7nXn 행렬이 과 row equivalent, 즉 echelon row reduction을 통해 로 만들 수 있다면 역행렬이 존재한다.   -&gt; 로 row reduction을 거치면 C가 역행렬이다.2.3 Characterizations of Invertible MatricesTheorem 8위와 같은 조건을 하나만 만족해도 역행렬이 존재하고 하나만 위배해도 역행렬이 존재하지 않는다. 마치 고리와 같이 상호 연결되어 있고 증명과정도 하나 하나 연결하면서 확인할 수 있다.",

    "run-through-of-java": {
        "title": "자바 훑어보기: Run-through of Java Programming Language",
            "author": "soonjune",
            "category": "",
            "content": "삼성 SDS 대학생 알고리즘 특강이 시작됐다. 1주일간은 자바, 1주일 간은 C++로 배운다고 한다. 자바를 거의 안 다뤄서 Codecademy에서 자바 부분을 쭉 훑었다. 주요 내용을 정리해보고자 한다.I. Introduction      Class - a single concept클래스는 객체 지향 언어에서 많이 등장하는 개념이다. 자바는 프로그램 파일명과 동일한 최소 하나의 클래스를 지녀야 한다(예: Person.java - Person 클라스). 클래스는 주로 대문자로 시작한다.    main() Method모든 자바 프로그램은 아래와 같이 main() method를 포함해야 한다.    public class Person {  public static void main(String[] args) { System.out.println(\"Hello, world!\");  }}                  Print LineSystem.out.println()을 이용한다.  Eclipse IDE에서는 syso를 타입한 뒤 CTRL+Space를 누르면 자동 완성된다.      Comments              Single line: //      Multi-line: /*   */      * ; - 코드는 ;로 끝나야 한다;        Compilation(javac 명령어)프로그램을 컴파일하면 각각의 클래스들이 .class 파일로 변환된다. 변환된 java byte code는 JVM에 의해 실행된다.II. Variables      Primitive Data Typesint, char, boolean, byte, long, short, double, float, null    String - use \" \"          String끼리 같은지 비교는 .equals() 사용      Concatenation: + 사용 =&gt; new를 사용하기 때문에 매우 느리다. 따라서 List를 사용해서 넣다 빼거나 StringBuilder를 사용하여 효율성을 높인다.        Statice Typing - 변수 선언 type과 value가 다를 경우 bug 발생III. 기타 빠르게 정리  Array(정적인 배열) / ArrayList(동적 할당 - add()와 remove() 사용)  Loop          for와 for-each      for는 C와 유사하고 for-each는 아래와 같이 수행      // array of numbersint[] numbers = {1, 2, 3, 4, 5};// for-each loop that prints each number in numbers// int num is the handle while numbers is the source arrayfor (int num : numbers) {  \tSystem.out.println(num);}  String Methods          length() - 길이      concat() - 두 String 연결      equals() - 앞에서 설명. true/false 반환      indexOf() - 특정 substring의 시작 index를 반환한다. 없을 경우 -1 반환.      charAt(int index) - String의 index번째(0부터 시작) character를 반환한다. index는 0부터 length-1까지.      toUpperCase() / toLowerCase() - String의 character를 모두 대문자 / 소문자로 바꾼 값을 반환한다.        클래스 상속(Inheritance) - parent class / child class          child class는 extends로 정의 / super로 child의 속성 override        다형성(Polymorphism) - 하나의 메소드나 클래스가 있을 때 이것들이 다양한 방법으로 동작하는 것(아래 예시 코드 참조)    // Parent classclass Animal {public void greeting() {  System.out.println(\"The animal greets you.\");}}// Child classclass Cat extends Animal {public void greeting() {  System.out.println(\"The cat meows.\");}}class MainClass {public static void main(String[] args) {  Animal animal1 = new Animal();  // Animal object  Animal cat1 = new Cat();  // Cat object  animal1.greeting(); // prints \"The animal greets you.\"  cat1.greeting(); // prints \"The cat meows.\"}}        Eclipse IDE 기능       클래스 내부에서 Alt+Shift+S를 눌러서 생성자 또는 출력 toString() 코드를 바로 생성할 수 있다.  비교 및 sort 방법    List&lt;CustomClass&gt; list = new ArrayList();// 정의대로 정렬Collections.sort(list);=Collections.sort(list, new Comparator&lt;CustomClass&gt;{  @Override  public int compare(CustomClass o1, CustomClass o2){      // 임의의 기준 설정      return 0;  }});CustomClass implements Comparable&lt;CustomClass&gt; {  int a;  int b;  @Override  public int compareTo(CustomClass arg0){      // -1: 원하는 순서, 0: 둘이 같다, 1:원하지 않는 순서 -&gt; swap      // a에 대해 오름차순으로 정렬       if(a &lt; arg0.a){          return -1;      } else if(a == arg0.a) {          // 둘이 같은 경우 b에 대해 내림차순 정렬          if(b &gt; arg0.b){              return -1;          } else if(b == arg0.b){              return 0;          } else{              return 1;          }      } else {          return 1;      }  }}      ",
        "url": "/Run-through-of-Java"
    }
    ,
    
    "linear-equations-in-linear-algebra-2": {
        "title": "1. Linear Equations in Linear Algebra (2)",
            "author": "soonjune",
            "category": "",
            "content": "선형대수 공부 2일차 - 오늘 배운 내용을 간단히 정리해보자1.5 Solution Sets of Linear Systems  homogeneous: A linear equation is called homogeneous if its constant term is zero. Such an equation has the form $$a_1x_1 + a_2x_2 + ... + a_nx_n = 0$$ where  are constants and  are variables.A homogeneous linear system is a linear system whose equations are all homogeneous. For example,$$3x_1 − 9x_2 − 9x_3 − 6x_4 = 0$$$$2x_1 − 8x_2 − 6x_3 + 2x_4 = 0$$$$−2x_1 + 3x_2 + 8x_3 + 7x_4 = 0$$is a homogeneous linear system.[1]  즉, 행렬을 사용해서 Ax = 0 꼴로 쓸 수 있으면 최소 하나의 해를 x가 영벡터인 최소 하나의 해를 가지며 이를 trivial solution이라 한다.  non-trivial한 해를 갖기 위해서는 방정식이 최소 하나의 free variable을 가져야한다.1.6 Applications of Linear Systems경제, network flow 등 다양하게 활용이 가능하다.1.7 Linear Independence선형 독립이라는 말이 나오며 앞서 본 방정식이 trivial solution을 가질 때 독립이라 한다.벡터의 해가 되는 계수들이 모두 0이어야 하며 그렇지 않은 경우가 하나라도 있으면 linearly dependent하다.Theorem 7: Characterization of Linearly Dependent Sets집합 S에 속한 벡터들 중 하나라도 다른 벡터의 선형 결합으로 표현할 수 있다면 linearly dependent하다.  벡터를 하나씩 추가해 가면서 linearly dependent한지 여부를 확인할 수 있다. 추가된 벡터를 앞선 벡터들의 linear combination으로 표현할 수 있는지 확인하면 된다.Theorem 8If a set contains more vectors than there are entries in each vector, then the set is linearly dependent. That is, any set  in  is linearly dependent if p &gt; n.즉 행렬의 열의 개수가 행의 개수보다 많다면 linearly dependent하다고 할 수 있다.  그 반대 p &lt; n인 경우는 상황에 따라 다르기 때문에 일반화할 수 없다.Theorem 9If a set S D  in  contains the zero vector, then the set is linearly dependent.   Zero vector가 존재하면 linearly dependent하다.1.8 Introduction to Linear Transformations  transformation은 function, mapping과 같은 말이다.인 linear transformation에 대하여  domain(정의역) -   codomain(공역) -   range(치역) / image - T(x)로 정의한다.  Linear Transformation은 아래 두 조건을 만족해야 한다.  i. T(u+v) = T(u) + T(v)    ii. T(cu) = cT(u) for all scalars c   위 조건으로부터 T(0) = 0이 유도된다.오늘 정리로 챕터1을 마쳤다. 중간고사도 여기까지가 범위인 것 같다. 이틀만에 중간고사 범위까지 공부해서 기분이 좋다(?).[1] 출처: http://faculty.bard.edu/~belk/math213f15/Notes10.pdf",
        "url": "/Linear-Equations-in-Linear-Algebra-2"
    }

    "linear-equations-in-linear-algebra-1": {
        "title": "1. Linear Equations in Linear Algebra (1)",
            "author": "soonjune",
            "category": "",
            "content": "오늘 선형대수 공부를 시작했다. 자료는 고려대에 계시다가 현재는 KAIST AI 대학원으로 가신 주재걸 교수님의 강의와 수업에 사용한 교과서를 참고했다.간단히 오늘 배운 내용을 정리해보자.오늘은 간단한 개요 정도였다. 요즘 교육과정에서는 행렬이 빠졌다고 하는데 구7차 교육과정에서 처음으로 등장하는 것이 행렬이었던 것 같다. 그러면 섹션별로 간단한 개념만 짚고 넘어가자.1.1 Systems of Linear Equations1) linear equation의 정의 =&gt; 이러한 linear equation(s)의 집합을 systems of linear equations 라 한다.   2) consistent - 하나 이상의 해가 존재하는 경우 / 그 반대로 해가 없는 경우는 inconsistent   3) 선형방정식을 행렬로 나타낼 수 있다. (coefficient matrix, augmented matrix)   4) linear system을 푸는 가장 기본적인 방법은 triangular form으로 만들어 주는 것이다. 이때 아래의 3가지 기본 row operation을 사용한다.=&gt; Replacement, Interchange, Scaling 세가지 row operation을 통해 만들 수 있는 행렬들은 row equivalent하다고 표현한다.1.2 Row Reduction and Echelon Forms    위와 같은 모양을 지닌 행렬의 형태를 echelon form 이라고 한다.  여기서 각 행의 맨 앞의 0이 아닌 수를 leading entry라고 한다. (여기서는 1, 2, 1)위와 같이 leading entry가 1이고 leading entry 밑뿐만 아니라 위의 원소들도 0이면 reduced echelon form이라고 부른다.Theorem 1: Uniqueness of the Reduced Echelon Form우선, 모든 행렬은 (reduced) echelon form으로 변환할 수 있다.  Echelon form인 행렬의 leading entry를 pivot position이라고 한다.  각 행에 pivot position이 존재하느냐의 여부에 따라이 해당 열이 basic variable인지 free variable인지 결정된다.Theorem 2: Existence and Uniqueness TheoremEchelon form의 행렬에서 [0, …, b] 꼴로 나오는 행(b는 0이 아닌 실수)이 존재하면 해가 없다.1.3 Vector Equations교환 법칙, 결합 법칙 등이 성립한다. span의 개념을 확인하자 - set of all possible linear combinations   등장개념 영상1.4 The Matrix Equation Ax = b공부를 하면서 최근에 본 물리학자인 파인만의 영상이 떠올랐다. 선형대수도 직관이 더해지면 더 오래 기억하고 의미있게 활용할 수 있을 것이다. 단순히 해를 구하는 것은 컴퓨터가 더 잘하니 숨겨진 의의를 찾는데 집중하면 좋을 것 같다.",
        "url": "/Linear-Equations-in-Linear-Algebra-1"
    }
    ,

            "content": "우연히 마이크로소프트에서 하는 Virtual Intership 코스에 등록하게 되었다.간단하게 인턴십 소개를 들었다. 기술적인 내용을 가르친다기 보다는 마이크로소프트가 어떻게 일하고 전반적인 기술 트렌드를 소개하기 위한 프로그램이라는 느낌이 들었다. 단순한 소개인 Module 1을 마무리 하고 Module 2에서는 SMART한 목표설정을 다뤘다.SMART한 목표란  Specific구체적이고  Measurable측정 가능하고  Achievable달성 가능하고  Relevant달성해야 하는 이유가 적당하며  Time Bound시간 제약 안에 달성해야하는 목표이다.소개 영상맞는 말인 것 같으면서도 과정에 대한 평가가 더해졌으면 어땠을까 하는 생각이 든다.스스로도 SMART한 골을 설정해봤다. 장기적이진 않고 단기 목표이지만 일단 이렇다.8월 15일까지 앞으로 공부할 인공지능에 필수적인 수학 공부(선형대수)를 하자. 선형대수 강의를 수강할 것이며 하루에 4강씩 수강한다. 상대적으로 쉬운 앞 부분을 빠르게 수강하면 가능할 것이라고 생각한다. 아마 하루 4시간씩 투자를 하게 될 것이다. 그날 공부한 내용을 블로그에 올리도록 하자목표를 달성할 수 있게 스스로를 한번 채찍질 해보자.",

    "node-js-study": {
        "title": "Node.js 잇몸으로 뽀개기 (studying Node.js)",
            "author": "",
            "category": "",
            "content": "왜 Node.js를 공부해야하는가Node.js의 가장 큰 장점은 방대한 npm 라이브러리다. 많은 사람들이 사용하고 있기 때문에 리소스도 풍부하고 내가 필요한 기능은 이미 다른 사람이 개발해 놓은 경우가 왕왕 있다고 한다. 일종의 네트워크 효과라고 보면 되겠다.또 다른 장점은 입출력(I/O)을 기다리는 방식에서 볼 수 있다. Node.js는 non-blocking 방식을 택하고 있는데 이는 데이터를 주고 받는 과정 동안 멈추지 않고 다른 일을 처리하는 것을 말한다. Rails 같은 blocking 방식을 택한 경우, 입출력 하나 하나씩 기다리느라 오랜 시간이 소요된다.아래 사진을 보면 확실히 이해가 된다. Non-blocking 방식이 자원을 훨씬 효율적으로 활용하고 결과도 빨리 받아볼 수 있다.1Node.js란 무엇인가내가 이해한 바로는 C++로 작성한 V8 Engine을 통해서 Javascript로 작성한 코드가 Machine Code로 작동하는 것이라고 한다. Node.js를 런타임이라고 하는데 런타임 단순히 말하면 프로그래밍 언어가 구동되는 환경이라고 이해하면 된다고 한다2. 명확하게 이해는 안되지만 Node.js는 자바스크립트로 작성된 코드가 실행될 수 있도록 도와주는 환경인 것 같다.향후 일정유데미에서 맥스와 함께 자바스크립트 공부를 차근차근 해 나간다. 궁극적으로 모바일 서버를 운영할 수 있는 실력을 갖추고 싶다.            https://homoefficio.github.io/2017/02/19/Blocking-NonBlocking-Synchronous-Asynchronous/ &#8617;              http://asfirstalways.tistory.com/99 &#8617;      ",
        "url": "/Node.js-study"
    }
    ,
    
    "vue-js": {
        "title": "Vue.js 개괄",

            "content": "Vue.js의 Componenet 개발 방식Vue의 컴포넌트는 모듈과 같다. 모듈이란 어플리케이션의 독립적인 한 부분이다. 모듈은 어플리케이션을 만들기 위한 부품과 비슷하다. Vue.js는 뷰-로직 모듈을 작성할 수 있도록 디자인된 라이브러리이다. 작은 모듈은 배우고, 이해하고, 유지하고, 재사용과 디버그 하는 것이 더 쉽다. 다른 개발자와 협업도 편해진다.Vue.js는 FIRST여야 한다. Focused(단일 책임 원칙), Independent(독립적인), Reusable(재사용 가능한), Small(작은), Testable(테스트 가능한). 각각의 컴포넌트는 너무 크지 않게 100라인 미만을 유지하는 것이 좋다. 또한, Vue 컴포넌트는 독립적으로 작동이 가능해야 한다.Vue.js 개발 방식의 단점은 Vue.js에서만 사용되는 문법을 익혀야 한다는 점, 이용자 커뮤니티가 작아서 활용 가능한 리소스가 작다는 점이 있다. Vue.js 개발자가 중국계 미국인이라 많은 수의 이용자가 중국인이다. 따라서 중국어를 잘 한다면 Vue.js를 더 잘 활용할 수 있을 것이다.props 와 Events Emittingprops 컴포넌트 속성은 JavaScript 객체를 전달하는 역할을 한다. 하위 컴포넌트로 객체를 전달한다. 컴포넌트 props를 잘 사용하면 당신의 컴포넌트는 항상 작동할 것이다. 이를 방어적 프로그래밍이라고 한다.  Events Emitting은 하위 컴포넌트에서 상위 컴포넌트의 이벤트를 발생시키는 것이다.출처: http://vuejs.kr/jekyll/update/2017/03/13/vuejs-component-style-guide/#%EC%BB%B4%ED%8F%AC%EB%84%8C%ED%8A%B8-props%EB%A5%BC-%EC%9E%98-%EC%82%AC%EC%9A%A9%ED%95%98%EA%B8%B0",
